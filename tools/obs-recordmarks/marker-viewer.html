<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RecordMarks — 録画マークを見る</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Yu Gothic",sans-serif;background:#11151c;color:#eef1f7}
body{margin:0 auto;max-width:1240px;padding:26px}h1{font-size:26px;margin:0 0 8px}p{color:#aebbd0;line-height:1.7}
.panel{border:1px solid #303c51;background:#1a2130;border-radius:12px;padding:18px;margin:18px 0}
.inputs{display:flex;flex-wrap:wrap;gap:18px}label{display:block;font-size:14px;font-weight:600}input,select,button{font:inherit;box-sizing:border-box;border:1px solid #44516a;border-radius:7px;background:#212c40;color:#eef1f7;padding:9px}
input[type=file]{display:block;margin-top:8px;max-width:100%}button{cursor:pointer}button:hover{background:#314566}button:disabled{opacity:.4;cursor:default}
.layout{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}video{width:100%;max-height:460px;background:#000;border-radius:9px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}.toolbar input{flex:1;min-width:150px}
#rows{max-height:620px;overflow:auto}.mark{display:block;width:100%;text-align:left;margin:8px 0;padding:13px}.mark.selected{border-color:#7caeff;background:#263b5a}
.meta{display:block;font-size:12px;color:#aec1df;margin-top:6px}.note{display:block;margin-top:8px;white-space:pre-wrap}.notice{color:#ffda95;font-size:13px}
#message{white-space:pre-wrap;overflow-wrap:anywhere}#active{font-weight:600;margin:12px 0}footer{font-size:12px;color:#aebbd0}
@media(max-width:850px){body{padding:16px}.layout{grid-template-columns:1fr}}
</style>
<h1>録画マークを見る</h1>
<p>マークから動画の前後へ移動できます。選んだファイルはこのブラウザ内だけで読み込みます。</p>
<section class="panel inputs">
<label>① 記録ファイル（複数選択可）<input id="jsonFiles" type="file" accept=".json" multiple></label>
<label>② 対応する録画動画（複数選択可）<input id="videoFiles" type="file" accept="video/*,.mkv,.mp4,.mov,.webm" multiple></label>
</section>
<div id="message" class="notice" role="status">まず .markers.json または .marker-session.json を選んでください。</div>
<div class="layout">
<section class="panel">
<video id="player" controls preload="metadata"></video>
<div id="active">動画未選択</div>
<div class="toolbar"><button id="before" disabled>前後を再生</button><button id="exact" disabled>マーク位置へ</button><button id="previous" disabled>前の候補</button><button id="next" disabled>次の候補</button></div>
<p class="notice">分割境界やエンコード遅延による時刻のずれは前後を再生して確認してください。MKV・AV1などはブラウザによって再生できない場合があります。</p>
</section>
<section class="panel">
<div class="toolbar"><input id="search" type="search" placeholder="ファイル名・メモで検索" aria-label="検索"><select id="kind" aria-label="種類"><option value="">すべて</option value="highlight">見せ場</option><option value="explanation">説明</option><option value="completion">完成</option><option value="custom">メモ</option></select></div>
<div class="toolbar"><span id="count">0件</span><button id="export" disabled>一覧をCSV保存</button></div>
<div id="rows"></div>
</section>
</div>
<footer>OBS RecordMarks 0.1.0 · 前後の範囲は同じ動画ファイル内で再生します。分割をまたぐ場合は隣の動画も確認してください。</footer>
<script>
'use strict';
const $ = id => document.getElementById(id);
let marks = [], filtered = [], selected = null, videos = new Map(), playbackEnd = null, generation = 0;
const labels = {highlight:'見せ場',explanation:'説明',completion:'完成',custom:'メモ'};
const player = $('player');
function finite(n) { return typeof n === 'number' && Number.isFinite(n) && n >= 0; }
function time(n) {
  if (!finite(n)) return '時刻不明';
  let total = Math.floor(n / 1000), h = Math.floor(total / 3600), m = Math.floor(total / 60) % 60, s = total % 60;
  return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':') + '.' + String(Math.floor(n)%1000).padStart(3,'0');
}
function name(path) { return String(path || '').split(/[\\/]/).pop(); }
function lookupVideo(filename) {
  const exact=videos.get(filename);if(exact)return exact;
  // OBS remuxes MKV to MP4 without changing the stem. Match only an unambiguous stem.
  const stem=filename.replace(/\.[^.]+$/,'');
  const matches=[...videos.entries()].filter(([key])=>key.replace(/\.[^.]+$/,'')===stem);
  if(matches.length>1)return {ambiguous:true};
  return matches.length===1?matches[0][1]:null;
}
function normalize(doc) {
  if (!doc || doc.schema_version !== 1 || !Array.isArray(doc.markers) || typeof doc.session_id!=='string') throw new Error('RecordMarks形式ではありません。');
  if (doc.format === 'obs-record-marks') {
    if (!doc.recording || typeof doc.recording.filename !== 'string') throw new Error('録画情報がありません。');
    return doc.markers.map(m=>({...m,session_id:doc.session_id,filename:doc.recording.filename,path:doc.recording.path,
      duration_ms:doc.recording.duration_ms,quality:doc.timing?.quality,
      time_ms:finite(m.time_ms)?m.time_ms:null}));
  }
  if (doc.format === 'obs-record-marks-session' && Array.isArray(doc.files)) {
    return doc.markers.map(m=>{
      const f=doc.files.find(x=>x.index===m.file_index);
      if (!f) throw new Error('マークに対応する録画ファイルがありません。');
      if(typeof f.filename!=='string')throw new Error('録画ファイル名が不正です。');
      const known=f.file_offset_known===true && finite(f.start_session_ms);
      const t=known && finite(m.session_time_ms)?Math.max(0,m.session_time_ms-f.start_session_ms):null;
      const duration=known && finite(f.end_session_ms)?f.end_session_ms-f.start_session_ms:null;
      const before=finite(m.before_ms)?m.before_ms:30000, after=finite(m.after_ms)?m.after_ms:15000;
      return {...m,session_id:doc.session_id,filename:f.filename||name(f.path),path:f.path,time_ms:t,
        review_start_ms:t===null?null:Math.max(0,t-before),
        review_end_ms:t===null?null:Math.min(t+after,duration??Infinity),duration_ms:duration,quality:f.timing_quality,
        context_crosses_file:t!==null && (t-before<0 || (duration!==null && t+after>duration))};
    });
  }
  throw new Error('対応していない記録ファイルです。');
}
function clearSelection() {
  selected=null;playbackEnd=null;player.pause();
  player.removeAttribute('src');player.load();$('active').textContent='候補をクリックしてください';
  for (const id of ['before','exact','previous','next']) $(id).disabled=true;
}
$('jsonFiles').addEventListener('change',async e=>{
  const token=++generation, nextMarks=[], errors=[], seen=new Set(), documents=[];
  clearSelection();
  for (const file of e.target.files) {
    try {
      const doc=JSON.parse(await file.text());
      const list=normalize(doc);
      for(const m of list) {
        if (!Number.isInteger(m.id)||!labels[m.kind]||typeof m.session_id!=='string') throw new Error('不正なマークです。');
      }
      documents.push({doc,list});
    }catch(err){errors.push(file.name+': '+err.message);}
  }
  if (token!==generation) return;
  const manifests=new Map(),sidecars=new Map();
  for(const entry of documents){
    const d=entry.doc,table=d.format==='obs-record-marks-session'?manifests:sidecars;
    const key=d.format==='obs-record-marks-session'?d.session_id:d.session_id+':'+d.recording.index;
    const previous=table.get(key);
    if(!previous||String(d.updated_at_utc||'')>=String(previous.doc.updated_at_utc||''))table.set(key,entry);
  }
  const chosen=[...manifests.values(),...[...sidecars.values()].filter(e=>!manifests.has(e.doc.session_id))];
  for(const entry of chosen)for(const m of entry.list){
    const key=m.session_id+':'+m.id;if(!seen.has(key)){seen.add(key);nextMarks.push(m);}
  }
  marks=nextMarks.sort((a,b)=>a.filename.localeCompare(b.filename,'ja')||(a.time_ms??0)-(b.time_ms??0));
  $('message').textContent=errors.length?errors.join('\n'):'記録を読み込みました。対応する動画を選ぶと再生できます。';
  render();
});
$('videoFiles').addEventListener('change',e=>{
  clearSelection();player.removeAttribute('src');player.load();
  for(const item of videos.values()) if(item.url) URL.revokeObjectURL(item.url);
  videos=new Map();
  for(const file of e.target.files){
    if(videos.has(file.name)) {
      const previous=videos.get(file.name);if(previous.url) URL.revokeObjectURL(previous.url);
      videos.set(file.name,{ambiguous:true});
    }else videos.set(file.name,{url:URL.createObjectURL(file)});
  }
  $('active').textContent='候補をクリックしてください';render();
});
function render(){
  const query=$('search').value.toLocaleLowerCase(),kind=$('kind').value;
  filtered=marks.filter(m=>(!kind||m.kind===kind)&&[m.filename,m.note,m.label].join(' ').toLocaleLowerCase().includes(query));
  if(selected&&!filtered.includes(selected))clearSelection();
  $('count').textContent=filtered.length+'件 / '+marks.length+'件';$('export').disabled=filtered.length===0;
  $('rows').replaceChildren();
  for(const m of filtered){
    const b=document.createElement('button');b.className='mark'+(m===selected?' selected':'');
    b.append(document.createTextNode(time(m.time_ms)+'　'+labels[m.kind]));
    const meta=document.createElement('span');meta.className='meta';meta.textContent=m.filename+' · 録画全体 '+time(m.session_time_ms);b.append(meta);
    if(m.note){const note=document.createElement('span');note.className='note';note.textContent=String(m.note);b.append(note);}
    const v=lookupVideo(m.filename);
    if(m.context_crosses_file||!finite(m.time_ms)||v?.ambiguous){
      const note=document.createElement('span');note.className='notice meta';
      note.textContent=v?.ambiguous?'同名の動画が複数あります。対象動画だけ選び直してください。':!finite(m.time_ms)?'途中追加のためファイル内時刻は不明です。':'確認範囲がファイル境界をまたぎます。';b.append(note);
    }
    b.addEventListener('click',()=>select(m,true));$('rows').append(b);
  }
  const index=filtered.indexOf(selected);
  $('previous').disabled=index<=0;$('next').disabled=index<0||index>=filtered.length-1;
}
function select(mark,withContext){selected=mark;render();seek(withContext);}
function seek(withContext){
  playbackEnd=null;player.pause();
  if(!selected)return;
  const mark=selected,item=lookupVideo(mark.filename);
  $('active').textContent=mark.filename+' · '+labels[mark.kind]+' '+time(mark.time_ms);
  if(!finite(mark.time_ms)){$('message').textContent='このマークはファイル内時刻が不明です。録画全体の時刻を参考に手動で確認してください。';$('before').disabled=true;$('exact').disabled=true;player.removeAttribute('src');player.load();return;}
  if(!item||item.ambiguous){$('message').textContent=item?.ambiguous?'同名動画を一つだけ選び直してください。':'対応する動画が未選択です: '+mark.filename;$('before').disabled=true;$('exact').disabled=true;player.removeAttribute('src');player.load();return;}
  $('before').disabled=false;$('exact').disabled=false;$('active').textContent=mark.filename+' · '+labels[mark.kind]+' '+time(mark.time_ms);
  const requested=(withContext&&finite(mark.review_start_ms)?mark.review_start_ms:mark.time_ms)/1000;
  const activate=()=>{
    if(selected!==mark||player.getAttribute('src')!==item.url)return;
    player.currentTime=Math.min(requested,Number.isFinite(player.duration)?Math.max(0,player.duration-0.05):requested);
    if(withContext){playbackEnd=(finite(mark.review_end_ms)?mark.review_end_ms:mark.time_ms+15000)/1000;player.play().catch(()=>{$('message').textContent='再生ボタンを押してください。';});}
  };
  if(player.getAttribute('src')!==item.url){player.onloadedmetadata=activate;player.src=item.url;player.load();}
  else if(player.readyState>=1)activate();else player.onloadedmetadata=activate;
  $('message').textContent='時刻は録画フレーム数による目安です。前後を見て確認してください。';
}
player.addEventListener('timeupdate',()=>{if(playbackEnd!==null&&player.currentTime>=playbackEnd){player.pause();playbackEnd=null;}});
player.addEventListener('error',()=>{$('message').textContent='この動画をブラウザで再生できません。MP4へ再多重化するか、外部プレーヤーで一覧の時刻を開いてください。再多重化でも映像コーデックによって再生できない場合があります。';});
$('before').addEventListener('click',()=>seek(true));$('exact').addEventListener('click',()=>seek(false));
$('previous').addEventListener('click',()=>{const i=filtered.indexOf(selected);if(i>0)select(filtered[i-1],true);});
$('next').addEventListener('click',()=>{const i=filtered.indexOf(selected);if(i>=0&&i+1<filtered.length)select(filtered[i+1],true);});
$('search').addEventListener('input',render);$('kind').addEventListener('change',render);
function cell(value){let s=String(value??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
$('export').addEventListener('click',()=>{
  const rows=[['動画','種類','ファイル内時刻','時刻ms','録画全体時刻','確認開始ms','確認終了ms','メモ']];
  for(const m of filtered)rows.push([m.filename,labels[m.kind],time(m.time_ms),m.time_ms,time(m.session_time_ms),m.review_start_ms,m.review_end_ms,m.note]);
  const blob=new Blob(['\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='record-marks.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
});
window.addEventListener('beforeunload',()=>{for(const item of videos.values())if(item.url)URL.revokeObjectURL(item.url);});
</script>
</html>
