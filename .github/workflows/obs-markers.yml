name: OBS Markers checks
on:
  push:
    branches: ["codex/obs-markers-0.1.0"]
    paths: ["tools/obs-markers/**", "tests/obs_markers_checks.py", ".github/workflows/obs-markers.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LuaJIT test runtime
        run: python -m pip install "lupa>=2.2,<3"
      - name: Run OBS script checks
        shell: bash
        run: python tests/obs_markers_checks.py 2>&1 | tee OBS-MARKER-CHECKS.log
      - name: Prepare installation files
        shell: bash
        run: |
          mkdir -p artifacts/EditAssist-OBS-Markers-0.1.0
          cp tools/obs-markers/editassist-markers.lua tools/obs-markers/README.md tools/obs-markers/MARKER-FORMAT.md OBS-MARKER-CHECKS.log artifacts/EditAssist-OBS-Markers-0.1.0/
      - uses: actions/upload-artifact@v4
        with:
          name: EditAssist-OBS-Markers-0.1.0
          path: artifacts/EditAssist-OBS-Markers-0.1.0/
          if-no-files-found: error
          retention-days: 30
